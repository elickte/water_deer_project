<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>고라니 키우기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .game-container {
            position: relative;
            width: 360px;
            padding: 10px;
            border: 2px solid black;
            margin: 20px auto;
        }

        .fruit-box {
            position: absolute;
            top: 10px;
            left: 10px;
            border: 1px solid black;
            padding: 4px 8px;
            background: white;
            z-index: 10;
        }

        .settings-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10;
        }

        .game-screen {
            width: 100%;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }

        .game-screen img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .tab-group {
            display: flex;
            margin-top: 10px; 
        }

        .tab-group button {
            flex: 1;
            padding: 8px 0;
            border: 1px solid black;
            background: white;
            cursor: pointer;
            margin-left: -1px;
        }

        .info-group {
            display: flex;
            margin-top: -1px;
        }

        .info-card {
            flex: 1;
            border: 1px solid black;
            background: white;
            padding: 8px 0;
            text-align: center;
            margin-left: -1px;
        }

        .info-card .title {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="fruit-box">열매 12,345</div>
        
        <button class="settings-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </button>

        <div class="game-screen">
            <img src="https://svgsilh.com/svg/47343.svg" alt="고라니">
        </div>

        <div class="tab-group">
            <button>강화</button>
            <button>동료</button>
            <button>펫</button>
            <button>스킨</button>
            <button>맵</button>
            <button>상점</button>
        </div>

        <div class="info-group">
            <div class="info-card">
                <span class="title">클릭당 열매</span>
                <span class="value">10</span>
            </div>
            <div class="info-card">
                <span class="title">초당 열매</span>
                <span class="value">50</span>
            </div>
            <div class="info-card">
                <span class="title">총 열매 생산량</span>
                <span class="value">1,234</span>
            </div>
        </div>
    </div>

</body>
</html>
