<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>고라니 키우기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .game-container {
            position: relative;
            width: 360px;
            padding: 10px;
            border: 2px solid black;
            margin: 20px auto;
        }

        .fruit-box {
            position: absolute;
            top: 10px;
            left: 10px;
            border: 1px solid black;
            padding: 4px 8px;
            background: white;
            z-index: 10;
        }

        .top-btn-group {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }

        .icon-btn {
            background: white;
            border: 1px solid black;
            padding: 2px 6px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-screen {
            width: 100%;
            height: 200px;
            margin-top: 40px;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .game-screen.active {
            display: flex;
        }

        .game-screen img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .tab-group {
            display: flex;
            margin-top: 10px;
        }

        .tab-group button {
            flex: 1;
            padding: 8px 0;
            border: 1px solid black;
            background: white;
            cursor: pointer;
            margin-left: -1px;
        }

        .tab-group button.active-btn {
            font-weight: bold;
            background: #eee;
        }

        .info-group {
            display: flex;
            margin-top: -1px;
        }

        .info-card {
            flex: 1;
            border: 1px solid black;
            background: white;
            padding: 8px 0;
            text-align: center;
            margin-left: -1px;
        }

        .info-card .title {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="game-container">
        <div class="fruit-box" id="berry">열매 0</div>

        <div class="top-btn-group">
            <button class="icon-btn" onclick="openTab('tab-main', null)">홈</button>
            <button class="icon-btn">
                <img src="https://svgsilh.com/svg/147414.svg" width="16" height="16" alt="설정">
            </button>
        </div>

        <div id="tab-main" class="game-screen active">
            <img src="https://www.svgrepo.com/show/396279/deer.svg" alt="고라니" onclick="clickDeer()">
        </div>

        <div id="tab-upgrade" class="game-screen">
            <p style="font-size: 16px; font-weight: bold;">강화 메뉴</p>
            <p style="font-size: 12px; margin-top: 6px;">클릭당 열매 증가 등 강화 기능</p>
        </div>

        <div class="tab-group">
            <button onclick="openTab('tab-upgrade', this)">강화</button>
            <button>동료</button>
            <button>펫</button>
            <button>스킨</button>
            <button>맵</button>
            <button>상점</button>
        </div>

        <div class="info-group">
            <div class="info-card" id="click_berry">
                <span class="title">클릭당 열매</span>
                <span class="value">1</span>
            </div>
            <div class="info-card" id="auto_berry">
                <span class="title">초당 열매</span>
                <span class="value">0</span>
            </div>
            <div class="info-card" id="sum_berry">
                <span class="title">총 열매 생산량</span>
                <span class="value">0</span>


            </div>
        </div>
    </div>

    <script>
        function openTab(tabId, btnElement) {
            const screens = document.querySelectorAll('.game-screen');
            screens.forEach(screen => screen.classList.remove('active'));

            const buttons = document.querySelectorAll('.tab-group button');
            buttons.forEach(btn => btn.classList.remove('active-btn'));

            document.getElementById(tabId).classList.add('active');

            if (btnElement) {
                btnElement.classList.add('active-btn');
            }
        }


    </script>

    <script src="./main.js"></script>
</body>

</html>
