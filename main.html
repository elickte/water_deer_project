<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>고라니 키우기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .game-container {
            position: relative;
            width: 360px;
            padding: 10px;
            border: 2px solid black;
            margin: 20px auto;
        }

        .fruit-box {
            position: absolute;
            top: 10px;
            left: 10px;
            border: 1px solid black;
            padding: 4px 8px;
            background: white;
            z-index: 10;
        }

        .top-btn-group {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }

        .icon-btn {
            background: white;
            border: 1px solid black;
            padding: 2px 6px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-screen {
            width: 100%;
            height: 200px;
            margin-top: 40px;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .game-screen.active {
            display: flex;
        }

        .game-screen img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* ===== 추가: 메인 화면 (고라니 + 스킨 + 클릭 이펙트) ===== */
        #tab-main {
            overflow: hidden;
        }

        .deer-box {
            position: relative;
            height: 150px;
            cursor: pointer;
            user-select: none;
        }

        .deer-box img {
            height: 150px;
            transition: transform 0.05s;
        }

        .deer-box:active img {
            transform: scale(0.95);
        }

        /* 스킨 아이콘 : 고라니 머리 위 */
        #skin-icon {
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            pointer-events: none;
        }

        /* 황금 고라니 스킨 */
        .deer-box.golden img {
            filter: sepia(1) saturate(5) hue-rotate(5deg) brightness(1.1);
        }

        #deer-info {
            font-size: 12px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 8px;
            border-radius: 8px;
        }

        .click-effect {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 15px;
            font-weight: bold;
            color: #c2410c;
            text-shadow: 1px 1px 0 white, -1px -1px 0 white;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        .click-effect.big {
            font-size: 20px;
            color: #dc2626;
        }

        @keyframes floatUp {
            from {
                opacity: 1;
                margin-top: 0;
            }

            to {
                opacity: 0;
                margin-top: -45px;
            }
        }

        /* 살 수 없는 버튼은 흐리게 */
        .btn-action:disabled {
            color: #aaa;
            border-color: #ccc;
            cursor: default;
            background: white;
        }

        .tab-group {
            display: flex;
            margin-top: 10px;
        }

        .tab-group button {
            flex: 1;
            padding: 8px 0;
            border: 1px solid black;
            background: white;
            cursor: pointer;
            margin-left: -1px;
        }

        .tab-group button.active-btn {
            font-weight: bold;
            background: #eee;
        }

        .info-group {
            display: flex;
            margin-top: -1px;
        }

        .info-card {
            flex: 1;
            border: 1px solid black;
            background: white;
            padding: 8px 0;
            text-align: center;
            margin-left: -1px;
        }

        .info-card .title {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 14px;
            font-weight: bold;
        }

        .btn-action {
            background: white;
            border: 1px solid black;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-action:hover {
            background: #eee;
        }

        .setting-layout {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 8px;
        }

        .setting-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: center;
        }

        .setting-right {
            flex: 1;
            border: 1px solid black;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-top: 4px;
        }

        .upgrade-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 0 10px;
        }

        .upgrade-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            border: 1px solid black;
            padding: 8px;
            margin-bottom: 6px;
        }

        .list-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 12px;
        }

        .list-item-info .desc {
            font-size: 10px;
            color: #666;
        }

        .list-item .btn-action {
            flex-shrink: 0;
            min-width: 64px;
        }

        .skin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
        }

        .skin-card {
            border: 1px solid black;
            padding: 6px;
            text-align: center;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .map-section {
            width: 100%;
            margin-bottom: 8px;
        }

        .map-section-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .map-card-main {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .map-card {
            border: 1px solid black;
            padding: 8px 4px;
            text-align: center;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="game-container">
        <div class="fruit-box" id="berry">열매 0</div>

        <div class="top-btn-group">
            <button class="icon-btn" onclick="openTab('tab-main', null)">홈</button>
            <button class="icon-btn" onclick="openTab('tab-suljung', null)">
                <img src="https://svgsilh.com/svg/147414.svg" width="16" height="16" alt="설정">
            </button>
        </div>

        <img src="https://media.istockphoto.com/id/1326389468/vector/beautiful-sunlit-forest.jpg?s=612x612&w=0&k=20&c=ik0tGlKOhIY4w85MvSnhgF05MogXxP2CDDBbHb-d57M="
            alt="배경"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;"
            id="background-img">

        <!-- 메인 : 고라니 + 스킨 아이콘 + 정보 (클릭 이펙트는 JS가 추가) -->
        <div id="tab-main" class="game-screen active"
            style="justify-content: center; align-items: center; position: relative; z-index: 1;">
            <div class="deer-box" id="deer-box" onclick="clickDeer(event)">
                <img src="https://www.svgrepo.com/show/396279/deer.svg" alt="고라니">
                <span id="skin-icon"></span>
            </div>
            <p id="deer-info"></p>
        </div>

        <div id="tab-suljung" class="game-screen" style="position: relative; z-index: 1; background: white;">

            <div class="setting-layout">
                <div class="setting-left">
                    <button class="btn-action">세이브 데이터 내보내기</button>
                    <button class="btn-action">세이브 데이터 불러오기</button>
                    <button class="btn-action" style="color: red;">데이터 초기화</button>
                </div>
                <div class="setting-right">
                    <p style="font-weight: bold; font-size: 13px;">게임 설정</p>
                    <div class="toggle-row">
                        <span>배경음</span>
                        <button class="btn-action">ON</button>
                    </div>
                    <div class="toggle-row">
                        <span>효과음</span>
                        <button class="btn-action">ON</button>
                    </div>
                    <div style="font-size: 11px; margin-top: 8px;">
                        버전 정보<br>v1.0.0
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. 강화 -->
        <div id="tab-upgrade" class="game-screen" style="position: relative; z-index: 1; background: white;">
            <div class="upgrade-layout">
                <div class="upgrade-info">
                    <p id="upgrade-level" style="font-weight: bold; font-size: 15px;">고라니 Lv. 1</p>
                    <p id="upgrade-desc" style="font-size: 12px;">클릭당 열매</p>
                </div>
                <button id="upgrade-btn" class="btn-action" style="padding: 12px 16px;" onclick="upgradeDeer()">
                    강화하기<br>열매 10
                </button>
            </div>
        </div>

        <!-- 3.1 동료 / 3.2 펫 : 목록은 main.js 의 render() 가 채움 -->
        <div id="tab-member" class="game-screen" style="position: relative; z-index: 1; background: white;"></div>

        <div id="tab-pet" class="game-screen" style="position: relative; z-index: 1; background: white;"></div>

        <!-- 5. 스킨 -->
        <div id="tab-skin" class="game-screen" style="position: relative; z-index: 1; background: white;">
            <div class="skin-grid" id="skin-grid"></div>
        </div>

        <!-- 6. 맵 -->
        <div id="tab-map" class="game-screen" style="position: relative; z-index: 1; background: white;">
            <div class="map-section">
                <div class="map-section-title">현재 맵</div>
                <div class="map-card-main" id="map-current">숲 (선택됨)</div>
            </div>
            <div class="map-section">
                <div class="map-section-title">맵</div>
                <div class="map-grid" id="map-grid"></div>
            </div>
        </div>

        <!-- 상점 -->
        <div id="tab-shop" class="game-screen" style="position: relative; z-index: 1; background: white;">
            <div class="list-item">
                <div class="list-item-info">
                    <span style="font-weight: bold;">열매 2배 부스터</span>
                    <span class="desc" id="booster-desc">30초 동안 모든 열매 2배</span>
                </div>
                <button class="btn-action" id="booster-btn" onclick="buyBooster()">구매<br>500</button>
            </div>
            <div class="list-item">
                <div class="list-item-info">
                    <span style="font-weight: bold;">이주호</span>
                    <span class="desc">랜덤으로 열매를 줌 (꽝 있음)</span>
                </div>
                <button class="btn-action" id="juho-btn" onclick="buyJuho()">구매<br>100</button>
            </div>
        </div>

        <div class="tab-group" style="position: relative; z-index: 1; background: white;">
            <button onclick="openTab('tab-upgrade', this)">강화</button>
            <button onclick="openTab('tab-member', this)">동료</button>
            <button onclick="openTab('tab-pet', this)">펫</button>
            <button onclick="openTab('tab-skin', this)">스킨</button>
            <button onclick="openTab('tab-map', this)">맵</button>
            <button onclick="openTab('tab-shop', this)">상점</button>
        </div>

        <div class="info-group" style="position: relative; z-index: 1;">
            <div class="info-card" id="click_berry">
                <span class="title">클릭당 열매</span>
                <span class="value">1</span>
            </div>
            <div class="info-card" id="auto_berry">
                <span class="title">초당 열매</span>
                <span class="value">0</span>
            </div>
            <div class="info-card" id="sum_berry">
                <span class="title">총 열매 생산량</span>
                <span class="value">0</span>
            </div>
        </div>
    </div>

    <!-- openTab 포함 모든 JS 는 main.js 에 있음 -->
    <script src="./main.js"></script>
</body>

</html>
