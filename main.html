<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>고라니 키우기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .game-container {
            position: relative;
            width: 360px;
            padding: 10px;
            border: 2px solid black;
            margin: 20px auto;
        }

        .fruit-box {
            position: absolute;
            top: 10px;
            left: 10px;
            border: 1px solid black;
            padding: 4px 8px;
            background: white;
            z-index: 10;
        }

        .top-btn-group {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }

        .icon-btn {
            background: white;
            border: 1px solid black;
            padding: 2px 6px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-screen {
            width: 100%;
            height: 200px;
            margin-top: 40px;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .game-screen.active {
            display: flex;
        }

        .game-screen img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* ===== 추가: 메인 화면 (고라니 + 스킨 + 클릭 이펙트) ===== */
        #tab-main {
            overflow: hidden;
        }

        .deer-box {
            position: relative;
            height: 150px;
            cursor: pointer;
            user-select: none;
        }

        /* 움직이는 사슴 캔버스 (deer-sprite.js 가 그림) */
        .deer-box canvas {
            display: block;
            height: 150px;
            aspect-ratio: 880 / 1000;
        }

        /* 스킨 아이콘 : 고라니 머리 위 (위치는 deer-sprite.js 가 매 프레임 맞춰줌) */
        #skin-icon {
            position: absolute;
            font-size: 26px;
            line-height: 1;
            pointer-events: none;
            transform-origin: 50% 100%;
        }



        /* 맵 배경 : 화면 맨 위 ~ 탭 버튼 위까지만 (전체를 덮으면 너무 확대돼서) */
        #background-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 260px; /* main.js 의 BG_HEIGHT 와 같게 */
            object-fit: cover;
            z-index: 0;
        }

        /* 고라니 : 위치(top)는 main.js 의 placeDeer() 가 땅 높이에 맞춰 줌 */
        #tab-main .deer-box {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 레벨 · 맵 정보 : 홈 버튼 옆, 반투명 */
        #deer-info {
            display: flex;
            align-items: center;
            white-space: nowrap;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            color: #222;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            backdrop-filter: blur(3px);
        }

        /* 영입한 동료들 : 메인 고라니 뒤 배경에 작게 (위치는 main.js 의 renderCrew) */
        #crew {
            position: absolute;
            inset: 0;
            pointer-events: none; /* 클릭은 고라니만 */
        }

        .crew-member {
            position: absolute;
            transform: translateX(-50%);
            animation: crewBob 1.6s ease-in-out infinite;
        }

        .crew-member img {
            display: block;
            height: 100%;
        }

        /* 왼쪽에 선 동료는 가운데(고라니) 쪽을 보게 좌우 반전 */
        .crew-member.flip img {
            transform: scaleX(-1);
        }

        @keyframes crewBob {
            50% { margin-top: -3px; }
        }

        .click-effect {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 15px;
            font-weight: bold;
            color: #c2410c;
            text-shadow: 1px 1px 0 white, -1px -1px 0 white;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        .click-effect.big {
            font-size: 20px;
            color: #dc2626;
        }

        @keyframes floatUp {
            from {
                opacity: 1;
                margin-top: 0;
            }

            to {
                opacity: 0;
                margin-top: -45px;
            }
        }

        /* 살 수 없는 버튼은 흐리게 */
        .btn-action:disabled {
            color: #aaa;
            border-color: #ccc;
            cursor: default;
            background: white;
        }

        .tab-group {
            display: flex;
            margin-top: 10px;
        }

        .tab-group button {
            flex: 1;
            padding: 8px 0;
            border: 1px solid black;
            background: white;
            cursor: pointer;
            margin-left: -1px;
        }

        .tab-group button.active-btn {
            font-weight: bold;
            background: #eee;
        }

        .info-group {
            display: flex;
            margin-top: -1px;
        }

        .info-card {
            flex: 1;
            border: 1px solid black;
            background: white;
            padding: 8px 0;
            text-align: center;
            margin-left: -1px;
        }

        .info-card .title {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 14px;
            font-weight: bold;
        }

        .btn-action {
            background: white;
            border: 1px solid black;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-action:hover {
            background: #eee;
        }

        .setting-layout {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 8px;
        }

        .setting-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: center;
        }

        .setting-right {
            flex: 1;
            border: 1px solid black;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-top: 4px;
        }

        .upgrade-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 0 10px;
        }

        .upgrade-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            border: 1px solid black;
            padding: 8px;
            margin-bottom: 6px;
        }

        .list-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 12px;
        }

        .list-item-info .desc {
            font-size: 10px;
            color: #666;
        }

        .list-item .btn-action {
            flex-shrink: 0;
            min-width: 64px;
        }

        .skin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
        }

        .skin-card {
            border: 1px solid black;
            padding: 6px;
            text-align: center;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .map-section {
            width: 100%;
            margin-bottom: 8px;
        }

        .map-section-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .map-card-main {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .map-card {
            border: 1px solid black;
            padding: 8px 4px;
            text-align: center;
            font-size: 11px;
        }

        /* 꾹 누르기 버튼 : 길게 눌러도 글자 선택·메뉴가 안 뜨게 */
        .hold-btn {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        /* ===== 오프라인 보상 창 ===== */
        #offline-popup {
            position: absolute;
            inset: 0;
            z-index: 90; /* 컷씬(100) 보다는 아래 */
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
        }

        #offline-popup.show {
            display: flex;
        }

        .offline-card {
            width: 240px;
            padding: 16px;
            text-align: center;
            background: #fffaf0;
            border: 2px solid #c2410c;
            border-radius: 12px;
            animation: charPop 0.3s;
        }

        .offline-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        #offline-time {
            font-size: 12px;
            white-space: pre-line;
            color: #555;
        }

        #offline-reward {
            margin: 8px 0 4px;
            font-size: 20px;
            font-weight: bold;
            color: #c2410c;
        }

        #offline-sleep {
            font-size: 11px;
            color: #666;
            margin-bottom: 10px;
        }

        /* ===== 컷씬 (story.js) ===== */
        #cutscene {
            position: absolute;
            inset: 0;
            z-index: 100;
            background: #111;
            display: none;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
            animation: cutFade 0.3s;
        }

        #cutscene.show {
            display: flex;
        }

        @keyframes cutFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 위 : 그림 칸 */
        .cut-stage {
            position: relative;
            flex: 1;
            overflow: hidden;
            border-bottom: 3px solid #f5d27a;
        }

        #cut-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 캐릭터 : 그림 칸 아래쪽 가운데 */
        /* 캐릭터 : 그림 칸 가운데, 발이 배경의 땅에 닿게 (bottom·height 는 story.js 가 맞춤) */
        .cut-char-box {
            position: absolute;
            left: 50%;
            bottom: 15%;
            transform: translateX(-50%);
            height: 70%;
        }

        #cut-char {
            height: 100%;
            animation: charPop 0.3s;
        }

        @keyframes charPop {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 그림 파일이 없을 때 보이는 칸 */
        .cut-holder {
            display: none;
            position: absolute;
            inset: 8px;
            align-items: center;
            justify-content: center;
            text-align: center;
            white-space: pre-line;
            font-size: 11px;
            color: #ccc;
            border: 2px dashed #666;
            background: #2a2a2a;
        }

        .cut-char-box .cut-holder {
            inset: auto;
            left: -50px;
            bottom: 0;
            width: 100px;
            height: 120px;
            background: #333;
        }

        /* 아래 : 대사 칸 */
        .cut-box {
            position: relative;
            height: 120px;
            padding: 22px 14px 10px;
            background: #fffaf0;
            color: #222;
        }

        #cut-name {
            position: absolute;
            top: -14px;
            left: 12px;
            padding: 3px 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            background: #c2410c;
            border: 2px solid #fffaf0;
            border-radius: 10px;
        }

        #cut-text {
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-line;
        }

        #cut-text.narration {
            text-align: center;
            font-style: italic;
            color: #555;
        }

        #cut-next {
            position: absolute;
            right: 12px;
            bottom: 8px;
            font-size: 12px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        #cut-page {
            position: absolute;
            left: 12px;
            bottom: 8px;
            font-size: 10px;
            color: #999;
        }

        .cut-skip {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
            padding: 3px 10px;
            font-size: 11px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid white;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="game-container">
        <div class="fruit-box" id="berry">열매 0</div>

        <div class="top-btn-group">
            <span id="deer-info"></span>
            <button class="icon-btn" onclick="openTab('tab-main', null)">홈</button>
            <button class="icon-btn" onclick="openTab('tab-suljung', null)">
                <img src="https://svgsilh.com/svg/147414.svg" width="16" height="16" alt="설정">
            </button>
        </div>
             
        <img src="https://media.istockphoto.com/id/1326389468/vector/beautiful-sunlit-forest.jpg?s=612x612&w=0&k=20&c=ik0tGlKOhIY4w85MvSnhgF05MogXxP2CDDBbHb-d57M="
            alt="배경"
            id="background-img">

<!-- 메인 : 고라니 + 스킨 아이콘 + 정보 (클릭 이펙트는 JS가 추가) -->
        <div id="tab-main" class="game-screen active" style="position: relative; z-index: 1;">
            <div id="crew"></div>
            <div class="deer-box" id="deer-box" onclick="clickDeer(event)">
                <canvas id="deer-canvas" aria-label="고라니"></canvas>
                <span id="skin-icon"></span>
            </div>
        </div>

        <div id="tab-suljung" class="game-screen" style="position: relative; z-index: 1; background: white;">

            <div class="setting-layout">
                <div class="setting-left">
                    <button class="btn-action" onclick="exportSave()">세이브 데이터 내보내기</button>
                    <button class="btn-action" onclick="importSave()">세이브 데이터 불러오기</button>
                    <!-- 불러오기용 파일 선택창 (숨김, 위 버튼이 대신 열어줌) -->
                    <input type="file" id="save-file" accept=".json,application/json" style="display: none;"
                        onchange="onSaveFile(this)">
                    <button class="btn-action" style="color: red;" onclick="resetGame()">데이터 초기화</button>
                </div>
                <div class="setting-right">
                    <p style="font-weight: bold; font-size: 13px;">게임 설정</p>
                    <div class="toggle-row">
                        <span>배경음</span>
                        <button class="btn-action">ON</button>
                    </div>
                    <div class="toggle-row">
                        <span>효과음</span>
                        <button class="btn-action">ON</button>
                    </div>
                    <div style="font-size: 11px; margin-top: 8px;">
                        버전 정보<br>v1.0.0
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. 강화 -->
        <div id="tab-upgrade" class="game-screen" style="position: relative; z-index: 1; background: white;">
            <div class="upgrade-layout">
                <div class="upgrade-info">
                    <p id="upgrade-level" style="font-weight: bold; font-size: 15px;">고라니 Lv. 1</p>
                    <p id="upgrade-desc" style="font-size: 12px;">클릭당 열매</p>
                </div>
                <!-- 꾹 누르면 연속 강화 -->
                <button id="upgrade-btn" class="btn-action hold-btn" style="padding: 12px 16px;"
                    onpointerdown="startHold(event, (q) => upgradeDeer(q))">
                    강화하기<br>열매 10
                </button>
            </div>
        </div>

        <!-- 3.1 동료 / 3.2 펫 : 목록은 main.js 의 render() 가 채움 -->
        <div id="tab-member" class="game-screen" style="position: relative; z-index: 1; background: white;"></div>

        <div id="tab-pet" class="game-screen" style="position: relative; z-index: 1; background: white;"></div>

        <!-- 5. 스킨 -->
        <div id="tab-skin" class="game-screen" style="position: relative; z-index: 1; background: white;">
            <div class="skin-grid" id="skin-grid"></div>
        </div>

        <!-- 6. 맵 -->
        <div id="tab-map" class="game-screen" style="position: relative; z-index: 1; background: white;">
            <div class="map-section">
                <div class="map-section-title">현재 맵</div>
                <div class="map-card-main" id="map-current">숲 (선택됨)</div>
            </div>
            <div class="map-section">
                <div class="map-section-title">맵</div>
                <div class="map-grid" id="map-grid"></div>
            </div>
        </div>

        <!-- 상점 -->
        <div id="tab-shop" class="game-screen" style="position: relative; z-index: 1; background: white;">
            <div class="list-item">
                <div class="list-item-info">
                    <span style="font-weight: bold;">열매 2배 부스터</span>
                    <span class="desc" id="booster-desc">30초 동안 모든 열매 2배</span>
                </div>
                <button class="btn-action" id="booster-btn" onclick="buyBooster()">구매<br>500</button>
            </div>
            <div class="list-item">
                <div class="list-item-info">
                    <span style="font-weight: bold;">부스터</span>
                    <span class="desc">랜덤으로 열매를 줌 (꽝 있음)</span>
                </div>
                <button class="btn-action" id="juho-btn" onclick="buyJuho()">구매<br>100</button>
            </div>
        </div>

        <div class="tab-group" style="position: relative; z-index: 1; background: white;">
            <button onclick="openTab('tab-upgrade', this)">강화</button>
            <button onclick="openTab('tab-member', this)">동료</button>
            <button onclick="openTab('tab-pet', this)">펫</button>
            <button onclick="openTab('tab-skin', this)">스킨</button>
            <button onclick="openTab('tab-map', this)">맵</button>
            <button onclick="openTab('tab-shop', this)">상점</button>
        </div>

        <div class="info-group" style="position: relative; z-index: 1;">
            <div class="info-card" id="click_berry">
                <span class="title">클릭당 열매</span>
                <span class="value">1</span>
            </div>
            <div class="info-card" id="auto_berry">
                <span class="title">초당 열매</span>
                <span class="value">0</span>
            </div>
            <div class="info-card" id="sum_berry">
                <span class="title">총 열매 생산량</span>
                <span class="value">0</span>
            </div>
        </div>

        <!-- 오프라인 보상 창 : main.js 의 showOfflinePopup() 이 띄움 -->
        <div id="offline-popup">
            <div class="offline-card">
                <p class="offline-title">💤 오프라인 보상</p>
                <p id="offline-time"></p>
                <p id="offline-reward"></p>
                <p id="offline-sleep"></p>
                <button class="btn-action" onclick="closeOfflinePopup()">받기</button>
            </div>
        </div>

        <!-- 컷씬 : story.js 가 내용을 채움 -->
        <div id="cutscene" onclick="clickStory()">
            <button class="cut-skip" onclick="skipStory(event)">건너뛰기 ▶▶</button>
            <div class="cut-stage">
                <img id="cut-img" alt="">
                <div class="cut-holder"></div>
                <div class="cut-char-box">
                    <img id="cut-char" alt="">
                    <div class="cut-holder"></div>
                </div>
            </div>
            <div class="cut-box">
                <div id="cut-name"></div>
                <p id="cut-text"></p>
                <span id="cut-page"></span>
                <span id="cut-next">▼</span>
            </div>
        </div>
    </div>

    <!-- openTab 포함 모든 JS 는 main.js 에 있음 -->
    <script src="./deer-move.js"></script>
    <script src="./skins.js"></script>
    <script src="./story.js"></script>
    <script src="./main.js"></script>
</body>

</html>
